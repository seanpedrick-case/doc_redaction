[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc_redaction"
version = "2.10.0"
description = "Redact PDF/image-based documents, Word, or CSV/XLSX files using a Gradio-based GUI interface"
readme = "README_PYPI.md"
authors = [
    { name = "Sean Pedrick-Case", email = "spedrickcase@lambeth.gov.uk" },
]
maintainers = [
    { name = "Sean Pedrick-Case", email = "spedrickcase@lambeth.gov.uk" },
]
license = "AGPL-3.0-only" # This licence type required to use PyMuPDF
keywords = [
    "redaction",
    "pdf",
    "nlp",
    "documents",
    "document-processing",
    "gradio",
    "pii",
    "pii-detection"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Topic :: Text Processing :: General",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
requires-python = ">=3.10"
dependencies = [
    "gradio>=6.31.0,<7",
    "gradio-pdf-redaction>=0.0.25,<1",
    "gradio_image_annotation_redaction>=0.7.4,<1",
    "spaces",
    "pdfminer.six<=20260107",
    "pdf2image>=1.17.0,<2",
    "pymupdf>=1.26.2,<2",
    "bleach>=6.4.0,<7",
    "opencv-python>=4.14.0.94,<5",
    "presidio_analyzer==2.2.362",
    "presidio_anonymizer==2.2.365",
    "presidio-image-redactor==0.0.61",
    "pikepdf>=10.12.0,<11",
    "pandas>=2.3.3,<4",
    "scikit-learn>=1.7.2,<1.8",
    "spacy>=3.8.18,<4",
    "boto3>=1.44.3,<2",
    "pyarrow>=25.0.1,<26",
    "openpyxl>=3.1.5,<4",
    "Faker>=40.44.0,<50",
    "python-levenshtein>=0.27.4,<1",
    "spaczz>=0.6.1,<1",
    "rapidfuzz>=3.10.0,<=3.14.5",
    "python-dotenv>=1.2.4,<2",
    #"awslambdaric>=4.2.3,<5",
    "python-docx>=1.2.0,<2",
    "polars>=1.44,<2",
    "defusedxml>=0.7.1,<1",
    "numpy>=2,<2.5.0",    
    "google-genai>=2.33.0,<3",
    "openai>=3.26.1,<4",
    "markdown>=3.10.3,<4",
    "tabulate>=0.9.0,<1",
    "pillow>=12.3.0,<13"
]

[project.optional-dependencies]

# For testing
dev = ["pytest"]
test = ["pytest", "pytest-cov"]

# To install the app with paddle and vlm support with pip, example command (in base folder and correct python environment): pip install .[paddle,vlm], or uv pip install .[paddle,vlm] if using uv. Note need to GPU version of Torch below

# Extra dependencies for PaddleOCR
# The following installs the CPU version of paddleOCR. paddleOCR is now run via torch, and a GPU version of torch can be installed manually by using: pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cu130 after installation
paddle = [
    "paddlepaddle>=3.3.1,<4", 
    "paddleocr>=3.7.0,<4",
    "torch<=2.14.1",
    "torchvision",
    "transformers>=5.19.0,<6",
]

# Extra dependencies for VLM models
# The following installs the CPU compatible version of pytorch. For torch cuda support you should run manually pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cu130 after installation
vlm = [
    "torch<=2.14.1",
    "torchvision",
    "transformers>=5.19.0,<6",
    "accelerate>=1.15.0,<2",
    "bitsandbytes>=0.50.2,<1", # Needed for on the fly quantisation in transformers
    "sentencepiece>=0.2.2,<1", # Needed for PaddleOCR-VL
]

# Run Gradio as an mcp server
mcp = [
    "gradio[mcp]>=6.31.0,<7"
]

[project.urls]
Homepage = "https://seanpedrick-case.github.io/doc_redaction/"
Repository = "https://github.com/seanpedrick-case/doc_redaction"

[project.scripts]
cli_redact = "doc_redaction.cli_redact:main"
mcp_doc_redaction = "mcp_doc_redaction.server:main"
doc_redaction_install_deps = "doc_redaction.install_deps:main"

[tool.setuptools]
include-package-data = true
py-modules = [
    "app",
    "agent_routes",
    "cli_redact",
    "lambda_entrypoint",
    "load_dynamo_logs",
    "load_s3_logs",
]

[tool.setuptools.package-data]
# Ensure non-code assets are included in wheels (PyPI installs).
doc_redaction = [
    "assets/*.png",
    "example_data/**/*",
]
tools = ["agentcore_harness_tools.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["doc_redaction*", "tools*", "mcp_doc_redaction*"]
exclude = [
    "test*",
    "cdk*",
    "src*",
]

# Configuration for Ruff linter:
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # line-too-long (handled with Black)
    "E402",  # module-import-not-at-top-of-file (sometimes needed for conditional imports)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

# Configuration for a Black formatter:
[tool.black]
line-length = 88
target-version = ['py310']

# Configuration for pytest:
[tool.pytest.ini_options]
markers = [
    "integration: optional slow tests (CLI PDF smoke; set PYTEST_CLI_INTEGRATION=1 where needed)",
    "live_agent: local compose + orchestrator LLM + redaction backend (see agent-redact/eval/README.md §5)",
    "deepeval_judge: optional DeepEval LLM-as-judge metrics (cloud judge API)",
]
filterwarnings = [
    "ignore::DeprecationWarning:click.parser",
    "ignore::DeprecationWarning:weasel.util.config",
    "ignore::DeprecationWarning:builtin type",
    "ignore::DeprecationWarning:websockets.legacy",
    "ignore::DeprecationWarning:websockets.server",
    "ignore::DeprecationWarning:spacy.cli._util",
    "ignore::DeprecationWarning:weasel.util.config",
    "ignore::DeprecationWarning:importlib._bootstrap",
]
testpaths = ["test"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "-m",
    "not integration and not live_agent and not deepeval_judge",
]